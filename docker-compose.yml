version: "3.9"

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - APP_VERSION=1.4.2
      - APP_ENV=local
      - DATABASE_PATH=/data/incidents.db
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health/live')"]
      interval: 20s
      timeout: 4s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

volumes:
  app-data:
