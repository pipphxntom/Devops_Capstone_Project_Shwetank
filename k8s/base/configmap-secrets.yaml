apiVersion: v1
kind: ConfigMap
metadata:
  name: capstone-devops-config
  namespace: capstone-devops-prod
data:
  APP_ENV: "production"
  SERVICE_NAME: "capstone-devops-api"
  LOG_LEVEL: "INFO"
---
apiVersion: v1
kind: Secret
metadata:
  name: capstone-devops-secrets
  namespace: capstone-devops-prod
type: Opaque
stringData:
  DATABASE_SECRET_KEY: "change-me-in-real-env"
  API_TOKEN: "demo-token-not-for-prod"
